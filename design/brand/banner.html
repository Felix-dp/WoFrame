<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:2400px; height:600px; overflow:hidden; background:#F7F3E8; position:relative;
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif }
  .art { position:absolute; inset:0;
    background-image:url("../../docs/assets/poster.jpg");
    background-size:2400px auto;
    background-position:0 -247px;
    background-repeat:no-repeat }
  .wash { position:absolute; inset:0;
    background:
      linear-gradient(90deg,#F7F3E8 0%,#F7F3E8 44%,rgba(247,243,232,.96) 54%,rgba(247,243,232,.55) 66%,rgba(247,243,232,.12) 80%,transparent 92%),
      linear-gradient(180deg,rgba(247,243,232,.55) 0%,transparent 18%,transparent 82%,rgba(247,243,232,.35) 100%) }
  .grain { position:absolute; inset:0; opacity:.05; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>") }
  .mark { position:absolute; left:148px; top:88px; font-family:"Songti SC","STSong",serif;
    font-weight:900; font-size:184px; line-height:.92; color:#16283A; letter-spacing:.02em }
  .mark span { display:block }
  .mark .one { margin-left:4px }
  .rule { position:absolute; left:536px; top:104px; width:1px; height:214px;
    background:linear-gradient(180deg,transparent,rgba(31,58,95,.42) 22%,rgba(31,58,95,.42) 78%,transparent) }
  .meta { position:absolute; left:572px; top:100px }
  .meta b { display:block; font-family:"Bodoni 72","Didot","Times New Roman",serif;
    font-size:82px; font-weight:400; letter-spacing:.04em; color:#16283A; line-height:1 }
  .meta em { display:block; font-style:normal; margin-top:16px; font-size:26px;
    letter-spacing:.32em; color:#43596C }
  .meta small { display:block; margin-top:13px; font-size:14px; letter-spacing:.5em;
    color:#7C8A96; text-transform:uppercase }
  .tag { position:absolute; left:148px; top:520px; font-size:16px; letter-spacing:.42em; color:#7C8A96 }
  .level { position:absolute; right:148px; top:520px; font-size:16px; letter-spacing:.34em;
    color:rgba(247,243,232,.86); text-shadow:0 1px 10px rgba(12,26,40,.45) }
</style></head>
<body>
  <div class="art"></div>
  <div class="wash"></div>
  <div class="mark"><span class="one">一</span><span>帧</span></div>
  <div class="rule"></div>
  <div class="meta">
    <b>WoFrame</b>
    <em>从一句话，到一段知识短片</em>
    <small>Agent workflow for short video</small>
  </div>
  <div class="tag">BoHack 2026.11</div>
  <div class="level">Next Level</div>
  <div class="grain"></div>
</body></html>
