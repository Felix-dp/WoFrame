<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  @page { size: 2400px 600px; margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:2400px; height:600px; overflow:hidden; background:#F7F3E8;
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif; position:relative }
  .ink { position:absolute; inset:-10%; filter:blur(38px); opacity:.9;
    background:
      radial-gradient(46% 70% at 88% 12%, rgba(31,58,95,.55), transparent 62%),
      radial-gradient(40% 62% at 74% 92%, rgba(74,107,138,.42), transparent 66%),
      radial-gradient(34% 50% at 62% 46%, rgba(58,94,102,.28), transparent 70%),
      radial-gradient(30% 46% at 97% 66%, rgba(28,50,78,.5), transparent 64%) }
  .paper { position:absolute; inset:0;
    background:
      radial-gradient(60% 90% at 12% 20%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(80% 120% at 100% 50%, rgba(255,255,255,.35), transparent 70%) }
  .grain { position:absolute; inset:0; opacity:.055; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>") }
  .horizon { position:absolute; left:0; right:0; top:430px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(31,58,95,.28) 30%,rgba(31,58,95,.12) 70%,transparent) }
  .frame { position:absolute; inset:0; }
  .mark { position:absolute; left:150px; top:96px; font-family:"Songti SC","STSong",serif;
    font-weight:900; font-size:188px; line-height:.92; color:#16283A; letter-spacing:.02em }
  .mark span { display:block }
  .mark .one { margin-left:6px }
  .rule { position:absolute; left:560px; top:110px; width:1px; height:230px;
    background:linear-gradient(180deg,transparent,rgba(31,58,95,.45) 20%,rgba(31,58,95,.45) 80%,transparent) }
  .meta { position:absolute; left:560px; top:104px; padding-left:34px }
  .meta b { display:block; font-family:"Bodoni 72","Didot","Times New Roman",serif;
    font-size:86px; font-weight:400; letter-spacing:.04em; color:#16283A; line-height:1 }
  .meta em { display:block; font-style:normal; margin-top:18px; font-size:27px;
    letter-spacing:.34em; color:#42586B }
  .meta small { display:block; margin-top:14px; font-size:15px; letter-spacing:.52em;
    color:#7C8A96; text-transform:uppercase }
  .tag { position:absolute; left:150px; top:520px; font-size:17px; letter-spacing:.42em; color:#7C8A96 }
  .badge { position:absolute; right:150px; top:520px; text-align:right; font-size:16px;
    letter-spacing:.34em; color:#7C8A96 }
  .seal { position:absolute; right:210px; top:106px; width:112px; height:112px;
    border:2px solid rgba(190,100,64,.75); border-radius:6px; display:grid; place-items:center;
    font-family:"Songti SC",serif; font-size:54px; color:#BE6440; transform:rotate(6deg) }
</style></head>
<body>
  <div class="paper"></div>
  <div class="ink"></div>
  <div class="horizon"></div>
  <div class="frame">
    <div class="mark"><span class="one">一</span><span>帧</span></div>
    <div class="rule"></div>
    <div class="meta">
      <b>WoFrame</b>
      <em>从一句话，到一段知识短片</em>
      <small>Agent workflow for short video</small>
    </div>
    <div class="seal">帧</div>
    <div class="tag">BoHack 2026.11</div>
    <div class="badge">Next Level</div>
  </div>
  <div class="grain"></div>
</body></html>
