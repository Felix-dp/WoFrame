<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选择参考 · woFrame</title>
<link rel="stylesheet" href="theme.css">
<style>
html{scroll-behavior:smooth}body{width:auto;height:auto;overflow:visible;background:radial-gradient(ellipse at 80% 10%,#ede8d7,transparent 34%),var(--paper)}
a{color:var(--brand)}button,input{font:inherit}button{cursor:pointer}
.topbar{padding-inline:clamp(20px,5vw,72px)}.topbar a{text-decoration:none}
main{max-width:1060px;margin:auto;padding:46px 24px 90px}
h1,h2{font-family:var(--font-display);font-weight:400;line-height:1.2}h1{font-size:clamp(33px,6vw,61px);margin:40px 0 12px}h2{font-size:30px;margin:0 0 12px}
.lede,.hint{color:var(--ink-2)}.hint{font-size:14px}.glass{border-radius:24px;padding:12px 18px;display:flex;align-items:center;gap:12px;width:min(100%,590px);view-transition-name:topic-glass}
.glass input,.link input{min-width:0;flex:1;border:0;background:none;color:var(--ink);padding:8px}.glass input:focus-visible,.link input:focus-visible{outline:2px solid var(--brand);border-radius:5px}
.choices,.examples{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.panel{padding:24px;min-width:0}
.upload{display:block;padding:14px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--paper);margin:16px 0}.upload input{display:block;width:100%;margin-top:6px}
.link{display:flex;gap:6px;border:1px solid var(--line-strong);border-radius:12px;padding:4px}.link .btn{white-space:nowrap}
video{display:block;width:100%;max-height:245px;background:#213529;border-radius:12px;margin:12px 0}
.bubble-field{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:7px;min-height:175px;margin:12px 0}
.bubble{--near:0;background:#f2eee3;color:var(--ink);border:1px solid #dfdcce;border-radius:52% 48% 46% 54% / 52% 56% 44% 48%;padding:9px 15px;min-height:44px;
 transform:translateY(calc(var(--near) * -3px)) scale(calc(1 + var(--near) * .12));transition:transform .2s,border-radius .2s,background .2s}
.bubble.near,.bubble:focus-visible{background:#e4ecdc;border-radius:37% 63% 60% 40% / 49% 42% 58% 51%}
.bubble[aria-pressed=true]{color:white;background:var(--brand);border-color:var(--brand)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:26px}.discover{display:inline-block;margin-top:18px;text-underline-offset:5px}
#examples{margin-top:92px;scroll-margin-top:26px}.examples{grid-template-columns:repeat(3,1fr)}.examples article{padding:18px}.sample{padding:20px 12px;border-radius:12px;background:var(--brand-soft);font:24px var(--font-display);min-height:105px;display:grid;place-items:center;text-align:center}
#topic-step{padding-top:35px}.topic-active .glass{margin:clamp(85px,16vh,165px) auto 0}.topic-active main{text-align:center}
[hidden]{display:none!important}
@media(max-width:720px){.choices,.examples{grid-template-columns:1fr}.panel{padding:18px}.glass input,.link input{font-size:16px}.btn{min-height:44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bubble{transition:none;transform:none}}
</style>
</head>
<body>
<header class="topbar"><a class="brand home-link" href="start.html"><span class="mark">w</span>woFrame</a><a class="home-link" href="start.html">返回首页</a></header>
<main>
  <div class="glass liquid-glass" id="topic-box"><label for="idea">主题</label><input id="idea" placeholder="比如：用骑车讲导数" maxlength="120"></div>
  <div id="reference-step">
    <h1>你有喜欢的视频或风格吗？</h1>
    <p class="lede">带一段参考过来，或者选几个你喜欢的讲法。</p>
    <div class="choices">
      <section class="panel card">
        <h2>带一个参考来</h2>
        <label class="upload">上传参考视频<input id="video-file" type="file" accept="video/*,.mp4,.mov,.webm"></label>
        <video id="local-preview" controls playsinline hidden></video>
        <form class="link" id="link-form"><input id="video-link" aria-label="视频链接" placeholder="粘贴视频链接或分享文案"><button class="btn" type="submit">添加</button></form>
        <p class="hint">抖音 · B 站 · YouTube · 视频号</p>
        <p id="reference-status" role="status"></p>
        <button class="btn" id="remove" type="button" hidden>移除参考</button>
      </section>
      <section class="panel card">
        <h2>选几个喜欢的讲法</h2>
        <div class="bubble-field" aria-label="风格量表">
          <button class="bubble" aria-pressed="false">生活化开场</button><button class="bubble" aria-pressed="false">悬念提问</button>
          <button class="bubble" aria-pressed="false">一步一图</button><button class="bubble" aria-pressed="false">时间线</button>
          <button class="bubble" aria-pressed="false">手绘白板</button><button class="bubble" aria-pressed="false">真人小窗</button>
          <button class="bubble" aria-pressed="false">慢慢讲</button><button class="bubble" aria-pressed="false">快节奏</button>
          <button class="bubble" aria-pressed="false">留白多一点</button><button class="bubble" aria-pressed="false">重点字幕</button>
        </div>
      </section>
    </div>
    <div class="actions"><button class="btn btn-primary" id="next">继续选主题 →</button></div>
    <a class="discover" href="#examples">还没想法？看看推荐案例 ↓</a>
    <section id="examples">
      <h2>看看不同的讲法</h2>
      <div class="examples">
        <article class="card"><h3>用骑车讲导数</h3><p>从生活例子进入，再逐步推导。</p><button class="btn example" data-style="生活化开场,一步一图">用这个讲法</button></article>
        <article class="card"><div class="sample">起点 → 转折 → 影响</div><h3>用时间线讲历史</h3><p>按三个关键节点组织讲解。</p><button class="btn example" data-style="时间线,慢慢讲">用这个讲法</button></article>
        <article class="card"><div class="sample">现象 → 猜测 → 验证</div><h3>从一个问题讲科学</h3><p>先请观众猜答案，再用图解验证。</p><button class="btn example" data-style="悬念提问,一步一图">用这个讲法</button></article>
      </div>
    </section>
  </div>
  <section id="topic-step" hidden>
    <h1>这次，你想讲什么？</h1>
    <p class="lede" id="selection-summary"></p>
    <div id="inspiration" aria-label="主题灵感" hidden></div>
    <button class="btn" type="button" id="show-inspiration">给我一些选题灵感</button>
    <button class="btn" type="button" id="back">返回修改参考</button>
    <button class="btn btn-primary" type="button" id="open-studio">带主题进入工作台 →</button>
  </section>
</main>
<script src="reference.js" defer></script>
</body>
</html>
