<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开讲 · 知识视频工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ec;color:#18372a;font:16px/1.6 "Instrument Sans","Microsoft YaHei",sans-serif}main{max-width:860px;margin:auto;padding:40px 24px 80px}header{font-weight:800;border-bottom:1px solid #cfd7c7;padding-bottom:18px}h1{font-size:clamp(34px,7vw,68px);line-height:1.12;letter-spacing:-.05em;margin:42px 0 12px}h2{margin:0 0 14px}section{background:#fffdf7;border:1px solid #dce0d0;border-radius:22px;margin-top:20px;padding:24px}input,textarea,select,button{font:inherit;border:1px solid #93a991;border-radius:10px;padding:10px;color:inherit;background:white}input[type=search],textarea{width:100%}button{cursor:pointer}button:not(:disabled):hover,button[aria-pressed=true]{background:#dcefcf}button.primary{background:#235d3d;color:white;font-weight:700;margin-top:16px}button.primary:hover{background:#184730}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.choices button{text-align:left;flex:1;min-width:145px}.choices small{display:block}.scene{margin-top:16px}.scene label{font-weight:bold}.scene textarea{display:block;margin-top:5px}#status{min-height:26px}video{max-width:100%}[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
#modelStatus{font-weight:400}
#suggestions button,#angles button,.scene{overflow-wrap:anywhere}
#keywords,#upload{max-width:100%}
button,select,input[type=search]{min-height:44px}
@media(max-width:480px){
  main{padding:24px 14px 48px}
  section{padding:16px}
  h1{margin-top:30px}
  #keywords{display:block;width:100%}
  #setup .row label{flex:1 1 120px}
  #setup select{display:block;width:100%;margin-top:4px}
}
</style>
<main>
<header>开讲 · 知识视频工作台 <small id="modelStatus" role="status"></small></header>
<h1>从一个词，开始讲。</h1>
<p>先找一个想讲的角度，再选动画或自己出镜。</p>
<div class="row"><label>内容语言 <select id="contentLanguage"></select></label>
<label>写稿模型 <select id="writingModel" disabled><option value="">默认</option></select></label></div>
<section>
<h2><label for="topic">你想讲什么？</label></h2>
<form id="topicForm"><input id="topic" type="search" placeholder="试试「微」或「概率」" required maxlength="120" autocomplete="off"></form>
<div id="suggestions" class="row" aria-label="主题联想"></div>
<div id="angles" class="row choices" aria-label="讲解方向" hidden></div>
<p id="topicStatus" role="status" hidden></p>
</section>
<section id="setup" hidden>
<h2>选择怎么讲</h2>
<div class="row"><label>画面 <select id="format"><option value="animation">动画讲解</option><option value="presenter">我来出镜</option></select></label>
<label>画风 <select id="style"><option value="paper">白板图解</option><option value="chalk">课堂黑板</option><option value="cards">简洁卡片</option></select></label></div>
<canvas id="stylePreview" width="960" height="540" style="width:240px;max-width:100%;border-radius:12px" aria-label="画风预览"></canvas><br>
<label>想提到的关键词 <input id="keywords" maxlength="100" placeholder="可留空"></label><br>
<button id="generate" class="primary">生成讲稿</button>
<p id="generationStatus" role="status"></p>
</section>
<section id="editor" hidden>
<h2 id="draftTitle"></h2>
<p id="draftNote"></p>
<div id="scenes"></div>
<div class="row"><button id="save">保存这一版</button><button id="undo">撤回到上一版</button><button id="export">下载讲稿</button></div>
<div class="row"><label><input id="learnOpening" type="checkbox"> 从我改过的开场学习讲法</label></div>
<div id="preference" hidden><p id="preferenceText"></p><label><input id="applyPreference" type="checkbox"> 新主题使用这条偏好</label> <button id="forget">清除开场偏好</button></div>
<p id="status" role="status"></p>
</section>
<section id="production" hidden>
<h2>工作台预览与试片</h2>
<p>正式成片请从项目的 Remotion 预览页生成并回看。</p>
<label>导出画质 <select id="exportHeight"><option value="540">540p</option><option value="480">480p</option><option value="720">720p</option><option value="1080">1080p</option></select></label>
<label id="mp4Option" hidden><input id="preferMp4" type="checkbox" checked> 导出为 MP4</label>
<div id="animationTools" hidden>
<canvas id="stage" width="960" height="540" style="width:100%;border-radius:12px" aria-label="动画预览"></canvas>
<div class="row"><button id="play">播放动画</button><button id="voiceDownload">导出有旁白的视频</button><button id="animationDownload">导出无声动画</button></div>
</div>
<div id="presenterTools" hidden>
<label>录制分镜 <select id="takeScene"></select></label>
<p id="takeCount" role="status"></p>
<video id="camera" style="width:100%" playsinline hidden></video>
<p id="teleprompter" style="white-space:pre-wrap;max-height:12em;overflow:auto"></p>
<div class="row"><button id="record">开始录制</button><button id="stopRecord" disabled>结束录制</button><label>上传口播视频 <input id="upload" type="file" accept="video/*"></label></div>
<button id="presenterDownload" disabled>下载这一段</button>
<button id="deleteTake" disabled>删除这一段</button>
<div class="row"><label><input id="includeCaptions" type="checkbox" checked> 显示分镜讲稿字幕</label><button id="presenterExport" disabled>导出整条口播</button></div>
</div>
<p id="productionStatus" role="status"></p>
</section>
</main>
<script type="module" src="./app.mjs"></script>
</html>
