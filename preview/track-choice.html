<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f9f7ef" />
  <title>选择航线 · WoFrame 一帧</title>
  <style>
    :root{--paper:#f9f7ef;--ink:#243c4a;--blue:#456e85;--blue-deep:#244c64;--orange:#d98253;--muted:#687b80;--stroke:#294956;--wash:#e8f1ee}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"KaiTi","STKaiti","Noto Serif SC",serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E");z-index:10}
    button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}a{color:inherit;text-decoration:none}
    .shell{max-width:1280px;min-height:100vh;margin:auto;padding:30px 54px 35px;display:flex;flex-direction:column;position:relative}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font:700 26px/1.1 "KaiTi",serif;letter-spacing:2px}.brand small{display:block;font:11px/1.5 system-ui,sans-serif;letter-spacing:.22em;color:var(--muted);margin-top:4px}
    .back{font:13px system-ui,sans-serif;border:1.6px solid var(--stroke);border-radius:50% 45% 48% 52%/45% 52% 48% 50%;padding:11px 17px;background:#fffdf6;box-shadow:3px 4px 0 #bed1ce;transition:transform .2s,box-shadow .2s}.back:hover{transform:translate(-2px,-2px);box-shadow:5px 6px 0 #bed1ce}.back:focus-visible,.choice:focus-visible,.continue:focus-visible,.reset:focus-visible{outline:3px solid var(--orange);outline-offset:5px}
    .intro{text-align:center;margin:40px auto 27px;position:relative}.eyebrow{display:inline-flex;gap:10px;align-items:center;font:12px system-ui,sans-serif;letter-spacing:.2em;color:var(--blue)}.eyebrow:before,.eyebrow:after{content:"";width:30px;border-top:1px dashed #9ab5b5}
    h1{font-size:clamp(37px,5.2vw,68px);font-weight:600;letter-spacing:.08em;margin:15px 0 12px;line-height:1.2}.underline{position:relative;white-space:nowrap}.underline:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:10px;border-top:3px solid var(--orange);border-radius:60% 35% 50% 35%;transform:rotate(-1deg)}
    .subtitle{font:15px/1.9 system-ui,sans-serif;color:var(--muted);margin:12px 0 0}.step{position:absolute;right:-135px;top:26px;font:13px system-ui,sans-serif;color:#82999b;transform:rotate(7deg)}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:31px;max-width:1030px;width:100%;margin:25px auto 25px}.choice{position:relative;min-height:360px;border:2px solid var(--stroke);border-radius:29px 23px 30px 22px / 23px 30px 23px 29px;box-shadow:6px 7px 0 #cbd8d3;background:#fffdf8;cursor:pointer;text-align:left;padding:27px 31px 25px;transform:rotate(-.45deg);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s;overflow:visible}
    .choice:nth-child(2){transform:rotate(.55deg)}.choice:hover,.choice:focus-visible{transform:translateY(-9px) rotate(-1.2deg);box-shadow:9px 14px 0 #cbd8d3}.choice:nth-child(2):hover{transform:translateY(-9px) rotate(1deg)}.choice[aria-pressed="true"]{background:#edf6f1;border-color:#276078;box-shadow:7px 9px 0 #9dbcb8}
    .choice-number{font:12px system-ui,sans-serif;letter-spacing:.15em;color:var(--muted)}.choice h2{font-size:30px;font-weight:600;margin:10px 0 8px}.choice p{font:14px/1.8 system-ui,sans-serif;color:#61777b;max-width:290px;margin:0}.choice .hint{position:absolute;bottom:26px;left:31px;font:13px system-ui,sans-serif;color:var(--blue-deep);display:flex;gap:8px;align-items:center}.choice .hint span{transition:transform .2s}.choice:hover .hint span{transform:translateX(6px)}.tick{position:absolute;right:23px;top:24px;border:2px solid #9caca9;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font:17px system-ui,sans-serif;color:transparent}.choice[aria-pressed="true"] .tick{color:white;background:var(--blue-deep);border-color:var(--blue-deep)}
    .art{height:155px;display:grid;place-items:center;position:relative;margin:9px 0 4px}.art svg{width:min(100%,290px);height:170px;overflow:visible}.doodle{stroke:var(--stroke);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:var(--orange)}.fill-blue{fill:#dcecf0}.fill-peach{fill:#f5d7be}.fill-mint{fill:#d9eadd}
    .boat-buddy{position:absolute;right:33px;top:-85px;width:98px;height:90px;opacity:0;transform:translateY(22px) rotate(9deg) scale(.8);pointer-events:none;transition:opacity .22s,transform .45s cubic-bezier(.17,1.45,.35,1)}.choice:hover .boat-buddy,.choice:focus-visible .boat-buddy{opacity:1;transform:translateY(0) rotate(-6deg) scale(1);animation:bob 2s ease-in-out infinite .45s}.boat-buddy svg{width:100%;height:100%;filter:drop-shadow(2px 4px 0 #ccd9d2)}.bubble{position:absolute;right:-12px;top:-22px;background:white;border:1.5px solid var(--stroke);border-radius:55% 45% 55% 35%;font:11px system-ui,sans-serif;padding:8px 10px;white-space:nowrap}
    .wake{transform-origin:center;animation:drift 4s ease-in-out infinite}.choice:hover .wake{animation-duration:1.6s}.cloud{animation:drift 6s ease-in-out infinite alternate}
    .bottom{text-align:center;margin:auto auto 0;padding-top:10px}.prompt{font:13px system-ui,sans-serif;color:#7c8d8b;margin:7px 0 17px}.continue{border:2px solid var(--stroke);background:#e3ece5;color:var(--blue-deep);border-radius:50% 47% 46% 49%/46% 50% 47% 49%;padding:14px 56px;font:600 17px "KaiTi",serif;box-shadow:4px 5px 0 #b7c9c4;transition:transform .2s,box-shadow .2s;cursor:pointer}.continue:hover:not(:disabled){transform:translateY(-3px);box-shadow:5px 8px 0 #b7c9c4}.continue:disabled{opacity:.42;cursor:not-allowed}.reset{display:block;border:0;background:transparent;color:var(--blue);text-decoration:underline;text-underline-offset:4px;cursor:pointer;margin:14px auto 0;font:12px system-ui,sans-serif}
    .footer{display:flex;justify-content:space-between;margin-top:28px;color:#9aaba6;font:11px system-ui,sans-serif;letter-spacing:.04em}.detail{max-width:590px;margin:14px auto 0;padding:23px 27px;border:1.8px dashed #71918f;border-radius:22px;background:#f1f5ed;text-align:center}.detail h2{margin:0 0 8px;font-size:23px}.detail p{font:14px/1.8 system-ui,sans-serif;color:#5a7275;margin:0}.detail[hidden]{display:none}
    @keyframes bob{50%{transform:translateY(-8px) rotate(-2deg) scale(1.02)}}@keyframes drift{50%{transform:translateX(9px)}}
    @media(max-width:760px){.shell{padding:23px 21px}.intro{margin:48px auto 16px}.step{position:static;transform:none;margin-top:16px}.choices{grid-template-columns:1fr;gap:28px;max-width:450px}.choice{min-height:340px}.boat-buddy{right:20px}.footer{gap:20px;line-height:1.6}h1{font-size:41px}.subtitle{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main class="shell">
  <header><a class="brand" href="/" aria-label="WoFrame 首页">一帧 <small>WOFRAME · CREATOR STUDIO</small></a><a class="back" href="/" aria-label="返回首页">← 返回首页</a></header>
  <section class="intro" aria-labelledby="page-title"><div class="eyebrow">START YOUR JOURNEY</div><h1 id="page-title">你的创作，想驶向<span class="underline">哪里</span>？</h1><p class="subtitle">先选一条航线吧。没有标准答案，只有更适合你的出发方式。</p><div class="step">STEP 01 / 02 ✳</div></section>
  <section class="choices" aria-label="选择内容方向">
    <button class="choice" type="button" data-track="traffic" aria-pressed="false" aria-describedby="traffic-description"><span class="choice-number">ROUTE 01 / 追逐浪花</span><span class="tick" aria-hidden="true">✓</span><div class="art" aria-hidden="true"><svg viewBox="0 0 300 180"><path d="M18 147q20-15 39 0t42 0t42 0t42 0t42 0t50 0" class="doodle" stroke="#81a9b0"/><path d="M40 160q19-11 39 0t41 0t42 0t42 0t48 0" class="doodle wake" stroke="#92bbc0"/><path d="M95 104l31 47h78l31-47z" class="doodle fill-blue"/><path d="M163 102V31l55 67z" class="doodle fill-peach"/><path d="M160 42l-32 57h32z" class="doodle fill-mint"/><path d="M163 25v77" class="doodle"/><path d="M46 43l6-11 6 11 11 5-11 4-6 12-6-12-10-4z" class="doodle accent"/><path d="M243 35l4-9 4 9 9 3-9 4-4 9-4-9-8-4z" class="doodle accent"/><path d="M236 76q15-15 29 0" class="doodle cloud"/><circle cx="76" cy="87" r="4" fill="#df9466"/><circle cx="258" cy="114" r="3" fill="#df9466"/></svg></div><h2>泛流量创作</h2><p id="traffic-description">跟上热点、拆解爆款。快速找到灵感，让作品乘风破浪。</p><span class="hint">适合想快速试水的你 <span>↗</span></span><span class="boat-buddy" aria-hidden="true"><svg viewBox="0 0 100 90"><path d="M15 55l17 22h43l14-22z" fill="#d8edf0" stroke="#244c64" stroke-width="3" stroke-linejoin="round"/><path d="M50 54V12L77 52z" fill="#f1cba8" stroke="#244c64" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="61" r="2.5" fill="#244c64"/><path d="M42 67q5 5 10 0" stroke="#244c64" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span class="bubble">冲呀！</span></span></button>
    <button class="choice" type="button" data-track="vertical" aria-pressed="false" aria-describedby="vertical-description"><span class="choice-number">ROUTE 02 / 深入海湾</span><span class="tick" aria-hidden="true">✓</span><div class="art" aria-hidden="true"><svg viewBox="0 0 300 180"><path d="M18 151q24-10 47 0t47 0t47 0t47 0t65 0" class="doodle" stroke="#81a9b0"/><path d="M45 164q18-8 36 0t39 0t39 0t39 0t48 0" class="doodle wake" stroke="#92bbc0"/><path d="M78 99l19 53h108l20-53z" class="doodle fill-mint"/><path d="M150 102V20l58 78z" class="doodle fill-peach"/><path d="M147 44l-34 54h34z" class="doodle fill-blue"/><path d="M150 17v86" class="doodle"/><path d="M53 66q5-8 11 0t11 0" class="doodle"/><path d="M233 35l8-15 8 15-8 15z" class="doodle accent"/><path d="M242 51v9m-15-17h-9m33 0h9" class="doodle accent"/><path d="M109 64q-4-9 4-16" class="doodle cloud"/><circle cx="79" cy="39" r="4" fill="#d98253"/></svg></div><h2>垂直领域创作</h2><p id="vertical-description">围绕热爱或专业持续分享。慢慢积累，做出有辨识度的系列。</p><span class="hint">适合有专长与长期方向的你 <span>↗</span></span><span class="boat-buddy" aria-hidden="true"><svg viewBox="0 0 100 90"><path d="M15 55l17 22h43l14-22z" fill="#d8e9dd" stroke="#244c64" stroke-width="3" stroke-linejoin="round"/><path d="M50 54V12L77 52z" fill="#f1cba8" stroke="#244c64" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="61" r="2.5" fill="#244c64"/><path d="M42 67q5 5 10 0" stroke="#244c64" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span class="bubble">慢慢来～</span></span></button>
  </section>
  <section class="bottom" aria-live="polite"><p class="prompt" id="choice-prompt">点选一张卡片，开启你的第一段航程 ↓</p><button class="continue" id="continue" type="button" disabled>就选这条航线 →</button><button class="reset" type="button" id="reset" hidden>重新选择</button><section id="detail" class="detail" hidden><h2 id="detail-title"></h2><p id="detail-copy"></p></section></section>
  <footer class="footer"><span>✳ 每一个好故事，都有自己的方向。</span><span>WoFrame / 一帧 · 让创作发生</span></footer>
</main>
<script>
  const cards = [...document.querySelectorAll('.choice')];
  const proceed = document.getElementById('continue');
  const prompt = document.getElementById('choice-prompt');
  const detail = document.getElementById('detail');
  const reset = document.getElementById('reset');
  let selected = null;
  function choose(track){
    selected = track;
    cards.forEach(card => card.setAttribute('aria-pressed',String(card.dataset.track === track)));
    proceed.disabled = false;
    proceed.textContent = track === 'traffic' ? '开启泛流量航线 →' : '开启垂直领域航线 →';
    prompt.textContent = track === 'traffic' ? '追着浪花走，灵感马上出发。' : '找到你的深蓝，故事慢慢展开。';
    detail.hidden = true; reset.hidden = true;
    const url = new URL(location.href); url.searchParams.set('track',track); history.replaceState(null,'',url);
    try{sessionStorage.setItem('woframe.creatorTrack',track)}catch{}
  }
  cards.forEach(card => card.addEventListener('click',()=>choose(card.dataset.track)));
  const current = new URLSearchParams(location.search).get('track');
  if(['traffic','vertical'].includes(current))choose(current);
  proceed.addEventListener('click',()=>{
    if(!selected)return;
    detail.hidden = false; reset.hidden = false;
    if(selected === 'traffic'){
      document.getElementById('detail-title').textContent = '追热点 · 从参考作品出发';
      document.getElementById('detail-copy').textContent = '下一站：提供参考视频，或寻找最近的热门内容。随后进入爆款拆解与快速成片流程。';
    }else{
      document.getElementById('detail-title').textContent = '垂直领域 · 再做一个小选择';
      document.getElementById('detail-copy').textContent = '下一站：选择「不露脸的知识系列」或「露脸的个人 IP」，再开始选题、文稿与成片。';
    }
    detail.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'nearest'});
  });
  reset.addEventListener('click',()=>{detail.hidden=true;reset.hidden=true;cards[0].focus()});
</script>
</body>
</html>
